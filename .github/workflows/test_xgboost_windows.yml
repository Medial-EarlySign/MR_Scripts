name: Debug Windows XGBoost Discovery

on:
  workflow_dispatch: # Manual trigger only

jobs:
  test-windows-xgboost:
    runs-on: windows-latest
    defaults:
      run:
        # Crucial for Windows Conda: ensures the environment is properly activated
        shell: cmd /C call {0} 

    steps:
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: test-env
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Install Dependencies
        run: |
          conda install -y cmake cxx-compiler "libxgboost==3.4.1"

      - name: Generate Source Code and CMakeLists
        shell: bash
        run: |
          # 1. Create a minimal C++ program using XGBoost
          cat << 'EOF' > main.cpp
          #include <iostream>
          #include <xgboost/c_api.h>
          #include <xgboost/learner.h>

          int main() {
              int major, minor, patch;
              XGBoostVersion(&major, &minor, &patch);
              std::cout << "=========================================" << std::endl;
              std::cout << "SUCCESS! XGBoost Version: " << major << "." << minor << "." << patch << std::endl;
              std::cout << "=========================================" << std::endl;
              return 0;
          }
          EOF
          
          # 2. Create the CMakeLists.txt
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(XGBoostDebug CXX)

          message(STATUS "Looking for XGBoost...")
          find_package(xgboost REQUIRED)
          message(STATUS "SUCCESS: XGBoost CMake config was found!")
          
          add_executable(DebugApp main.cpp)
          target_link_libraries(DebugApp xgboost::xgboost)
          EOF

      - name: Physically Locate XGBoost Files
        run: |
          echo "Scanning Conda environment for XGBoost headers and libs..."
          dir /s /b "%CONDA_PREFIX%" 2>nul | findstr /i "xgboost.lib xgboost.dll learner.h c_api.h"

      - name: Test 1 - Build Standard
        run: |
          mkdir build_standard
          cd build_standard
          
          echo "Testing out-of-the-box CMake behavior..."
          set "CMAKE_GENERATOR_TOOLSET=v143"
          cmake ..
          cmake --build . --config Release

      - name: Run the compiled executable(s)
        run: |
          echo.
          build_standard\Release\DebugApp.exe
          