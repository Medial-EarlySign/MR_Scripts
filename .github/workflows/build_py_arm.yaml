name: Build medpython (Linux Arm)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python Version to Build'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
      publish_to_pypi:
        description: 'Publish to PyPI?'
        required: true
        default: false
        type: boolean

jobs:
  build_arm_wheels:
    name: Build on Linux Arm (${{ inputs.python_version }})
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # --- 0. INSTALL SYSTEM DEPENDENCIES (Linux) ---
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install podman -y
          sudo apt-get autoremove -y
          sudo apt-get clean

      # --- BUILD PYTHON PACKAGE ---
      - name: Build Python Packages
        run: |
          cd Docker/medbuild_tools.new/04.medpython_arm
          ./create.sh ${{ inputs.python_version }}


      - name: Extract Artifacts
        run: |
          mkdir -p dist
          podman run --rm -dt --name medpython_cont manylinux_medpython bash
          podman cp medpython_cont:/earlysign/app/MR_LIBS/Internal/MedPyExport/generate_binding/wheelhouse/. dist/
          podman stop medpython_cont

      # --- UPLOAD ARTIFACT (Prepare for Job 2) ---
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.publish_to_pypi && 'pypi-dist' || 'build-only-dist' }}-${{ github.run_attempt }}
          # We grab the repaired wheels from wheelhouse
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # - name: Test MedPython
      #   run: |
      #     python -c 'import med'
