name: Generate PyPi package of Medial EarlySign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_python_packages:
    name: Build Wheels (Manylinux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prepare Docker/Podman
        run: |
          sudo apt-get update
          sudo apt-get install podman -y
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Build Python Packages
        run: |
          cd Docker/medbuild_tools.new/04.medpython
          ./create.sh

      - name: Extract Artifacts
        run: |
          mkdir -p dist
          podman run --rm -dt --name medpython_cont manylinux_medpython bash
          podman cp medpython_cont:/earlysign/app/MR_LIBS/Internal/MedPyExport/generate_binding/wheelhouse/. dist/
          podman stop medpython_cont

      - name: Upload distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
